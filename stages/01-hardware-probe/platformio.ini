; Xteink X3 e-reader (ESP32-C3, 16 MB flash, no PSRAM)
; Hardware notes: docs/hardware-x3.md

[env:xteink_x3]
; Arduino core 3.x via pioarduino. Same release CrossPoint Reader ships on the X3/X4,
; so it is known to work on this exact chip.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = esp32-c3-devkitm-1    ; generic C3 module; we override flash size below
framework = arduino

board_build.mcu         = esp32c3
; MUST be dio: the generic C3 board defaults to qio, whose bootloader puts the
; X3's Puya flash in quad mode -> every read returns 0xFF ->
; "partition 0 invalid magic number 0xffff" boot loop. (CrossPoint uses dio too.)
board_build.flash_mode  = dio
board_build.flash_size  = 16MB
board_upload.flash_size = 16MB
board_build.partitions  = default_16MB.csv

; Native USB-Serial/JTAG: Serial goes over the USB-C port itself.
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_port   = /dev/ttyACM0
