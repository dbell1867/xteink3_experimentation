# PC tools for the Xteink X3 project. Install the `x3` command (editable: it uses
# this repo's tools/ in place, so a git pull updates it):
#   uv tool install --editable .
[project]
name = "x3-tools"
version = "0.16.0"
license = "MIT"
description = "Render lessons and marimo talking points for the Xteink X3 and sync them over USB"
requires-python = ">=3.11"
dependencies = ["freetype-py", "pillow", "markdown-it-py", "pyserial"]

[project.scripts]
x3 = "x3:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "tools" }
py-modules = ["x3", "mdpages", "notes2xtc", "xtcinfo"]
